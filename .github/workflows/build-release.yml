name: Build custom k6 and publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AMD64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true

      - name: Build and test
        run: bash scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: custom-k6-linux-amd64
          path: dist/custom-k6_*_linux_amd64.tar.gz

  build-windows:
    name: Build Windows AMD64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true

      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: custom-k6-windows-amd64
          path: dist/custom-k6_*_windows_amd64.zip

  publish:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: custom-k6-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum custom-k6_* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/custom-k6_*
            dist/SHA256SUMS
